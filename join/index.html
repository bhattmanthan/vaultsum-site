<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a group · Vaultsum</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#101418">
<style>
  :root { --bg:#fff; --ink:#101418; --muted:#5b636b; --line:#e3e6e9; --teal:#0f8b7d; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1215; --ink:#e8ebee; --muted:#9aa3ab; --line:#262c31; --teal:#4fd1bf; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:56px 16px; text-align:center; }
  img { width:64px; height:64px; border-radius:14px; box-shadow:0 0 0 1px var(--line); }
  h1 { font-size:1.6rem; line-height:1.25; margin:20px 0 8px; }
  p { color:var(--muted); }
  .cta { display:block; margin:14px 0; padding:14px; border-radius:14px; background:var(--ink); color:var(--bg); font-weight:600; text-decoration:none; }
  .cta.alt { background:none; color:var(--teal); box-shadow:inset 0 0 0 1px var(--line); }
</style>
</head>
<body>
<main>
<img src="../icon.svg" alt="">
<h1>You're invited to a group on Vaultsum</h1>
<p>Split expenses with friends. Open this link on the phone where you have the app and it opens the invite.</p>
<a class="cta" id="open" href="#">Open in Vaultsum</a>
<a class="cta alt" href="https://play.google.com/apps/testing/in.expenseledger.app">Get the app</a>
<p><small>Sign in with the phone number or Google account the invite was sent to.</small></p>
</main>
<script>
  // The app handles this URL itself when installed; this button is the fallback for browsers
  // that opened the page instead (custom-scheme intent, ignored if the app isn't there).
  var id = new URLSearchParams(location.search).get('i') || '';
  document.getElementById('open').href = /^[A-Za-z0-9]+$/.test(id) ? 'expensetracker://join/' + id : '#';
</script>
</body>
</html>
